name: Build and test

on:
  push:
  pull_request:

jobs:
  cobol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuCOBOL
        run: sudo apt-get update && sudo apt-get install -y gnucobol

      - name: Compile and run all sample queries
        run: |
          chmod +x run.sh tests/run-tests.sh
          tests/run-tests.sh

      - name: Show the full-season report
        if: always()
        run: ./run.sh cards/ALLGOALS.txt
